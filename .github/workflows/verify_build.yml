name: Z. Verify Build (no TestFlight)

run-name: Verify Build Loop (${{ github.ref_name }})

# Triggers on push to ci/** branches and manual dispatch.
# Runs the same `build_loop` fastlane lane the production workflow uses,
# but does NOT run `release` (the TestFlight upload).
# Saves the IPA + buildlog as artifacts for inspection.
on:
  push:
    branches:
      - 'ci/**'
  workflow_dispatch:

jobs:
  verify_build:
    runs-on: macos-26
    name: Build (no upload)
    steps:
      - name: Select Xcode version
        run: sudo xcode-select --switch /Applications/Xcode_26.2.app/Contents/Developer

      - name: Checkout
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GH_PAT }}
          submodules: recursive

      # Patch Fastlane Match to not print tables (matches production workflow)
      - name: Patch Match Tables
        run: |
          TABLE_PRINTER_PATH=$(ruby -e 'puts Gem::Specification.find_by_name("fastlane").gem_dir')/match/lib/match/table_printer.rb
          if [ -f "$TABLE_PRINTER_PATH" ]; then
            sed -i "" "/puts(Terminal::Table.new(params))/d" "$TABLE_PRINTER_PATH"
          else
            echo "table_printer.rb not found"
            exit 1
          fi

      - name: Install Project Dependencies
        run: bundle install

      - name: Sync clock (workaround for code-sign clock skew)
        run: sudo sntp -sS time.windows.com

      - name: Fastlane Build & Archive (no TestFlight upload)
        run: bundle exec fastlane build_loop
        env:
          TEAMID: ${{ secrets.TEAMID }}
          GH_PAT: ${{ secrets.GH_PAT }}
          FASTLANE_KEY_ID: ${{ secrets.FASTLANE_KEY_ID }}
          FASTLANE_ISSUER_ID: ${{ secrets.FASTLANE_ISSUER_ID }}
          FASTLANE_KEY: ${{ secrets.FASTLANE_KEY }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: build-artifacts-${{ github.run_number }}
          path: |
            artifacts
            buildlog
